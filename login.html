<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCatálogo | Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/general.css">
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
    <main class="login">
        <h1>MiniCatálogo</h1>
        <p>Inicia sesión para administrar tu catálogo</p>

        <form id="formLogin">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.com" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>

            <p id="mensajeLogin"></p>
            <button type="submit">Iniciar sesión</button>
        </form>

        <a href="index.html">Volver al inicio</a>
    </main>

    <script src="Js/login.js"></script>
</body>
</html>
