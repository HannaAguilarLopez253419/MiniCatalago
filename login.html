<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCatálogo | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/general.css">
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
    <main class="login">
        <h1>MiniCatálogo</h1>

        <section id="seccionLogin">
            <p>Inicia sesión para administrar tu catálogo</p>

            <form id="formLogin">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>

                <p id="mensajeLogin"></p>
                <button type="submit">Iniciar sesión</button>
            </form>

            <a href="#" id="irRegistro">¿No tienes cuenta? Regístrate</a>
        </section>

        <section id="seccionRegistro" hidden>
            <p>Crea tu cuenta y registra tu negocio</p>

            <form id="formRegistro">
                <label for="nombreNegocio">Nombre de tu negocio</label>
                <input type="text" id="nombreNegocio" placeholder="Ej. Cafetería Aroma" required>

                <label for="correoRegistro">Correo electrónico</label>
                <input type="email" id="correoRegistro" placeholder="ejemplo@correo.com" required>

                <label for="contrasenaRegistro">Contraseña</label>
                <input type="password" id="contrasenaRegistro" placeholder="Mínimo 4 caracteres" minlength="4" required>

                <label for="confirmarContrasena">Confirmar contraseña</label>
                <input type="password" id="confirmarContrasena" placeholder="Repite tu contraseña" required>

                <p id="mensajeRegistro"></p>
                <button type="submit">Crear cuenta</button>
            </form>

            <a href="#" id="irLogin">¿Ya tienes cuenta? Inicia sesión</a>
        </section>

        <a href="index.html">Volver al inicio</a>
    </main>

    <script src="Js/login.js"></script>
</body>
</html>
